; Project 8 Plus live link (thp8_mod_livelink.dll) -- the bridge between the level editor and the running game.
; Off by default. When on, the game listens on 127.0.0.1 only (never on the network) and every connection
; must present the random token from the session file. See PROTOCOL.md.

[livelink]
; 1 = start the live link. The environment variable PS3_LIVELINK=1 / 0 wins over this.
enabled = 0

; TCP port on 127.0.0.1; 0 = any free port (the session file says which). PS3_LIVELINK_PORT overrides.
port = 0

; Where to write {port, token, pid}; empty = <mods folder>\livelink.json. PS3_LIVELINK_FILE overrides.
session_file =

; 1 = log every request
verbose = 0
