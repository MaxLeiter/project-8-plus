; Project 8 Plus (native plugin) -- configuration
;
; Lives next to the plugin DLL: <port exe dir>\mods\plugins\thp8_mod_p8plus.ini
; (the loader reads <dll basename>.ini). Read once at start-up: restart the game
; after editing. Every key can also be overridden from the environment:
;   PS3MOD_<PLUGIN>_<KEY>, e.g. PS3MOD_THP8_MOD_P8PLUS_FPS=unlocked
; (see ps3mod.h; <PLUGIN> = the DLL basename, upper-case).
; Keys are unique, so the section names are only for reading.
; Booleans: on/off, 1/0, true/false, yes/no.
;
; Defaults = the recommended set of the retired RPCS3 patch release:
; 60 FPS, 60 FPS Menus, Hor+ (auto) + 16:9 HUD, Bloom 50%, Neutral Color Grading,
; Ped/Object Draw Distance x2, plus the "high" picture-quality bundle of the native
; port's renderer (see [renderer] below). Everything else stays stock.
; Setting every game option to its stock value makes the plugin unload itself
; (the [renderer] keys are still passed on to the renderer).

[framerate]
; 30 (stock) | 60 | 120 | 144 | 165 | 240 | any 61..360 | monitor | unlocked
;   60       = "60 FPS": presents every vblank instead of every 2nd. Game speed and
;              physics are unaffected (the game measures real frame time).
;   120, 144, ... = high refresh: a precise frame cap at that rate (the game's
;              vblank stays at 60 Hz, so its timers keep their speed).
;   monitor  = cap at the monitor's refresh rate, locked to its vblank (the
;              smoothest choice on a 120/144 Hz display with vsync on).
;   unlocked = no frame cap: as fast as the port renders (VRR / benchmarks).
; Above 60 needs a port build with frame pacing (plugin ABI 1.1); an older
; build treats 120/144/monitor as unlocked.
fps = 60

; on  = vsync (no tearing; the display's refresh rate is the upper limit)
; off = tearing allowed: for VRR (G-Sync / FreeSync) displays and uncapped
;       benchmarks. Tearing needs the game in borderless fullscreen (F11).
vsync = on

; Frames the swap chain may queue: 0 = the port's default (DXGI: 3),
; 1 = lowest input latency, 2 = a little smoother on a busy CPU.
frame_latency = 0

; How fps above 60 is produced: flip (default) = a separate frame-cap clock,
; the game's 60 Hz vblank untouched; vblank (EXPERIMENTAL) = the game's own
; vblank runs at that rate (its vblank-counted waits run faster).
fps_method = flip

; "60 FPS Menus": movie-backed menus (main / career / pause / city map) stay at 60
; instead of dropping to 30 (with fps above 60: run at the fps setting). Needs
; fps = 60 or more (ignored with fps = 30). Bink movies keep their own speed.
menus60 = on

; "60 FPS Cutscenes" (EXPERIMENTAL): script cutscenes run unlocked instead of 30.
; Check lip / audio sync. Needs fps = 60/unlocked and menus60 = on.
cutscenes60 = off

[widescreen]
; Hor+ field of view: same vertical view as 16:9, more on the sides.
;   auto       follow the game window's aspect live (k = window aspect / 16:9);
;              a 16:9 or narrower window is left stock (k = 1)
;   off        stock projection (a wide window then shows a stretched image)
;   21:9, 32:9, 3440x1440, 2.37, ...   force this display aspect
;              (replaces the yml's fixed "Ultrawide 21:9 / 32:9 / 48:9" variants)
; The port stretches its 1280x720 image to the window, so make the window
; your monitor's shape (e.g. borderless 5120x1440 for 32:9).
hor_plus = auto

; "16:9 HUD": keeps HUD, menus and text at 16:9 proportions, centered, while the 3D
; view is Hor+. Full-screen fades / backgrounds / movies stay full width.
; Only acts when hor_plus makes the picture wider than 16:9.
hud169 = on

; Pillarbox (native only): Bink movies (menu backdrops, intro and cutscene movies)
; and the boot / loading screens are shown at 16:9 in the middle with black bars at the
; sides, instead of stretched across the wide window. off = stretched, as in the
; RPCS3 version. Only acts when hor_plus and hud169 are active.
pillarbox = on

; Picture-in-picture views (the camcorder panel of photo / film goals, goal intro
; camera views, the photo capture) render into a texture that is never stretched
; to the window, so Hor+ leaves them at the stock 16:9 projection (off). on = the
; old behavior: they get the wide field of view too and look squeezed.
hor_plus_pip = off

[graphics]
; Bloom strength in percent: 100 = stock, 50 = "Bloom 50%" (recommended),
; 25 = "Bloom 25%", 0 = "No Bloom" (effect disabled). Any value 0..200 works;
; only 0/25/50/100 were tested under RPCS3.
bloom = 50

; "Neutral Color Grading": saturation and contrast 1.0 instead of the levels'
; 0.75-0.9 washed-out grade. The in-game Brightness option still works.
neutral_grading = on

; Depth of field (Focus mode, Nail the Trick, some bail effects).
; off = "No Depth of Field". Not part of the recommended set: stock = on.
dof = on

; Full-screen blur effects (retina burn / skater heaven, Chaplin film look,
; factory launcher):
;   on    stock
;   off   "No Screen Blur": Blur effects disabled
;   tints "No Radial Blur (keep tints)": no radial/zoom blur, color tint kept
screen_blur = on

; Film grain (Noise effect in a few scripted scenes). off = "No Film Grain".
film_grain = on

; "Ped/Object Draw Distance": multiplier for SuspendDistance and lod_dist1/2/3 of
; everything with a suspend component (peds, animals, moving props).
; 1 = stock (peds pop at ~65 m), 2 = x2 (recommended), 4 = x4 (more CPU).
; Range 1..8; only 2 and 4 were tested under RPCS3.
draw_distance = 2

; Render list guard (native): when more objects are in view than a level's render
; bucket holds (1280 instances; likely with draw_distance 2 in a crowded level such as
; the Factory), the game walks on into data that is not an object and hangs. on = the
; full bucket is closed at its last slot (one object not drawn that frame). off = stock.
render_list_guard = on

; Blood splats fade (native): the game never runs the update that ages its texture splats
; (bail blood, grit), so a smear stays until the level changes. on = they live their
; LifeTime (15-25 s for bail blood) and fade out. off = stock.
splat_fade = on

; HUD guard (native): the game hides its HUD for goal intros, camera scenes, cutscenes, menus
; and shows it again when they end; when such a sequence is cut short the HUD can stay
; hidden. on = a HUD that is still hidden 2 s after every hiding scene / menu has ended is
; shown again (one log line each time). off = stock.
hud_guard = on

; "Shadow Distance" (EXPERIMENTAL): multiplier for shadow_lod_dist1/2 (stock 30/150)
; of every shadow component. 1 = stock, 2 = the yml's x2. Range 1..4.
shadow_distance = 1

; Distance haze in percent (native only): the levels' atmospheric haze (the blue-white
; veil over distant buildings and trees) and the Fog screen effect some areas use (the
; garages, Cretepark). 100 = stock (the PS3 look), 50 = half (crisper, more contrast in
; the distance), 0 = no haze. Any value 0..200.
haze = 100

; "No LOD (debug nolod)": TEST ONLY. Never hides / LODs suspend components but does
; not extend SuspendDistance (far peds may freeze). Forces draw_distance = 1.
nolod = off

[renderer]
; ---- Picture quality (native port only) -------------------------------------------
; Higher resolution, smoother edges, sharper textures and better shadows, drawn by
; the port's own renderer on your PC's GPU. The game itself is not changed (no extra
; PS3 memory, saves untouched). The cost is GPU time; the shipped settings below are
; meant for a current graphics card. If the game stutters, lower render_scale first
; (2 instead of auto), or use graphics_preset = vanilla.
;
; Needs a port build that has the renderer's graphics options (PS3_GFX_*); an older
; exe silently ignores everything in this section.
;
; GO BACK TO STOCK (the PS3's own picture): set
;     graphics_preset = vanilla
;     render_scale = 1
; (aa, aniso and kick ship as "preset", so they follow the bundle and are off with
; vanilla. If you gave any of them a value of your own, set it back to preset, off
; or 1, or delete / comment out every line of this section with a ';'.)
;
; Which setting wins for each option, strongest first:
;   1. a PS3_GFX_* variable you set yourself before starting the game, e.g.
;      set PS3_GFX_SCALE=2  (PS3_GFX_SCALE, _AA, _ANISO, _KICK, _SSAA, _SHARPEN,
;      _SHADOW_SCALE, _SHADOW_FILTER; PS3_GFX_PRESET stands in for graphics_preset below and
;      does not switch the keys of this section off)
;   2. the key of this section (render_scale, aa, aniso, kick, shadow_*)
;   3. graphics_preset, the bundle
; A key you leave out or set to "preset" is not set: graphics_preset decides it.
; (A graphics.ini next to thp8.exe is the port's own settings file; it loses to 1 and
; 2 but wins over graphics_preset.)

; Quality bundle: vanilla | high | ultra
;   vanilla  nothing changed
;   high     2x resolution, FXAA, 16x anisotropic filtering, soft 2x shadows (PCF),
;            kick 128, 1.5x supersampling, sharpening 35
;   ultra    your monitor's resolution, FXAA, 16x AF, 4x contact-hardening shadows
;            (PCSS), kick 128, 1.5x supersampling, sharpening 35. Needs a fast
;            graphics card.
; The keys below change single options of the bundle.
graphics_preset = high

; Render scale: the game draws at this multiple of its 1280x720 and the picture is
; then scaled to your window. Bigger = much sharper and smoother (this is
; supersampling), and the largest GPU cost.
;   1        stock 1280x720, stretched to the window
;   2, 3     2x (2560x1440), 3x (3840x2160). Any factor from 1 to 6 works, e.g. 1.5
;   auto     the resolution of the monitor the game window is on, even in a small
;            window (on a 1440p monitor that is 2, on a 4K monitor 3)
;   5120x1440  an exact size for the 1280x720 frame. Not 16:9 is fine: use your
;            monitor's shape with Hor+ (5120x1440 on a 32:9 screen)
; (PS3_GFX_SCALE of the port.)
render_scale = auto

; Anti-aliasing (smooths jagged edges): preset | off | fxaa | fxaa_all
;   preset    not set here: graphics_preset decides (high / ultra = fxaa,
;             vanilla = off)
;   off       no anti-aliasing, whatever the bundle says
;   fxaa      smooths the 3D picture only, HUD and text stay crisp. Gameplay only:
;             menus are not smoothed
;   fxaa_all  smooths the whole picture, text included (slightly softer), menus too
; render_scale = 2 or more already smooths edges; fxaa mops up what is left.
; (PS3_GFX_AA of the port.)
aa = preset

; Anisotropic filtering: keeps ground, walls and ramps sharp when seen at a slant.
; preset | 1 (off) | 2 | 4 | 8 | 16. 16 is cheap on a current card.
;   preset    not set here: graphics_preset decides (high / ultra = 16, vanilla = off)
; (PS3_GFX_ANISO of the port.)
aniso = preset

; GPU hand-off (speed only, the picture is identical): the renderer normally
; collects a whole frame and only then lets the GPU start. This sends the work over
; every <kick> draw calls, so the GPU renders while the game is still preparing the
; frame; it hides much of the cost of the options above.
;   0          off (stock)
;   128        what the "high" and "ultra" bundles use. Any value from 16 to 100000
;   preset     not set here: graphics_preset decides (high / ultra = 128)
; (PS3_GFX_KICK of the port.)
kick = preset

; Supersampling: the game draws at this multiple of render_scale (per side) and the
; picture is filtered down to your window. This is what smooths leaves, bushes,
; fences, wires and gate railings, which FXAA cannot reach, and it stops them
; shimmering when the camera moves. GPU cost only (the game's own work is unchanged).
;   preset   not set here: graphics_preset decides (high / ultra = 1.5,
;            vanilla = off)
;   off      no supersampling (1)
;   1.5      2.25 samples per pixel
;   2        4 samples per pixel (the most expensive; 32:9 at 2 = a 10240x2880 frame)
; (PS3_GFX_SSAA of the port.)
supersample = preset

; Sharpening (contrast-adaptive): restores texture detail after anti-aliasing and
; scaling without halos on edges or text. 0 (off) .. 100.
;   preset   not set here: graphics_preset decides (high / ultra = 35, vanilla = 0)
; (PS3_GFX_SHARPEN of the port.)
sharpen = preset

; "Shadow Resolution": the port's renderer draws the game's two shadow maps
; (1024x1024 near / 512x512 far cascade) at this multiple of their size and samples
; them at that resolution. The game is not changed (no extra PS3 VRAM).
; 1 = not set here: graphics_preset decides (high = 2, ultra = 4; vanilla = stock).
; 2 = 2048/1024, 4 = 4096/2048: forced whatever the bundle says.
; (PS3_GFX_SHADOW_SCALE of the port.)
shadow_resolution = 1

; "Shadow Filtering":
;   hw    not set here: graphics_preset decides (high = pcf, ultra = pcss;
;         vanilla = the PS3's 2x2 filtered compare, hard slightly jagged edges)
;   pcf   soft edges (wide percentage-closer filter): forced
;   pcss  contact-hardening soft shadows: sharp where the caster touches the
;         ground (feet, wheels), softer with height: forced
; (PS3_GFX_SHADOW_FILTER of the port; PS3_GFX_SHADOW_RADIUS / PS3_GFX_PCSS_K tune it.)
shadow_filter = hw

[controls]
; ---- Button prompts ----------------------------------------------------------------
; Which button glyphs menus, tutorials and the loading-screen tips show:
;   auto      follow the device you are using, live: keyboard keys while you play on the
;             keyboard, Xbox glyphs (A B X Y, LB RB LT RT, View/Menu, LS/RS) as soon as you
;             press something on an XInput (Xbox) controller, and back. At start-up: Xbox when
;             a controller is connected, else keyboard.
;   keyboard  always the keyboard keys of your bindings below
;   xbox      always the Xbox glyphs
;   ps3       always the PS3 glyphs (stock; also the right choice for a PlayStation pad
;             behind Steam Input / DS4Windows, which reports itself as an Xbox pad)
; The keyboard glyphs are drawn at start-up for your own bindings (and keyboard layout)
; into mods\_kb_prompts. The Xbox glyphs need the prompt pack in mods\_xbox_prompts, built
; from your game files by thp8-mod\tools\tex\xbox_prompts.py (build, then install --mods
; <mods>); without it a controller shows the PS3 glyphs.
button_prompts = auto

; on  = button glyphs centered on the text next to them (help bars, tips, goal text, menus):
;       the game draws them about 3 px (at 720p) low, hanging below the line; this lifts all
;       of them -- PS3, Xbox and keyboard glyphs -- by adjusting the font's glyph baseline at
;       full glyph size
; off = where the game puts them
center_button_glyphs = on

; ---- Keyboard ------------------------------------------------------------------------
; The port plays the game on the keyboard (and mouse buttons) and an Xbox controller at the
; same time. One line per PS3 input: the keys that press it, separated by commas; the FIRST
; key is the one the prompts show. A key may stand in several lines and then presses all of
; them (F below = L3 + R3 = Nail the Trick). "none" = unbound. A line you delete or comment
; out keeps the port's default (the values below).
; Key names are the key's place on a US keyboard, whatever your layout (on AZERTY "W" is the
; key labeled Z; the prompts show your own letters): A-Z 0-9 Space Enter Tab Esc Backspace
; LShift RShift LCtrl RCtrl LAlt RAlt CapsLock Up Down Left Right Insert Delete Home End
; PageUp PageDown F1-F12 Num0-Num9 NumPlus NumMinus NumEnter Minus Equals LBracket RBracket
; Semicolon Apostrophe Comma Period Slash Backslash Grave, and the mouse: MouseLeft
; MouseRight MouseMiddle Mouse4 Mouse5 WheelUp WheelDown.
; Keys reach the game only while its window has the focus. Esc no longer closes the window.
key_cross    = Space, Enter, K, MouseLeft    ; ollie / accept
key_square   = J                             ; flip tricks
key_circle   = L                             ; grab tricks
key_triangle = I, Backspace, MouseRight      ; grind / lip / back
key_l1       = Q                             ; spin left
key_r1       = E                             ; spin right
key_l2       = U                             ; flips and rolls, revert
key_r2       = O                             ; spine transfer, revert
key_l3       = LShift, F                     ; focus (F also presses R3: Nail the Trick)
key_r3       = F
key_start    = Esc                           ; pause
key_select   = Tab
key_ls_up    = W                             ; steer / walk / menus (left stick)
key_ls_down  = S
key_ls_left  = A
key_ls_right = D
key_up       = Up, WheelUp                   ; d-pad: menus, also steers
key_down     = Down, WheelDown
key_left     = Left
key_right    = Right
key_rs_up    = Num8                          ; right stick: Nail the Trick right foot, camera
key_rs_down  = Num5, Num2
key_rs_left  = Num4
key_rs_right = Num6

; ---- Camera ----------------------------------------------------------------------------
; The game's own look-around invert switches (the right stick camera), the same as pause menu
; > OPTIONS > CONTROL SETUP > INVERT X-AXIS / INVERT Y-AXIS:
;   off  the view turns the way you push the stick, as in most current games (P8Plus default)
;   on   the stock game's setting: push the stick right and the camera swings round so the
;        view turns left (it orbits the skater); up / down likewise
; Applied whenever a level's camera is made, and kept in sync with that menu: a switch you
; flip there is written back here. Nail the Trick (right foot) is not affected.
camera_invert_x = off
camera_invert_y = off

[menus]
; ---- Create-A-Skater ---------------------------------------------------------------------
; on  = the item lists of Create-A-Skater (shirts, pants, shoes, hats, hair, faces, decks,
;       grip tape, shirt logos, ...) put the highlighted item on your skater, like current games do:
;       X keeps it, DONE / back puts back what you were wearing. Only X changes your
;       skater (and what a save stores). Color, logo position and size sliders were
;       already live in the stock game.
; off = stock: the skater changes only when you press X.
cas_preview_on_focus = on

; How long the cursor has to rest on an item before it is put on (milliseconds, 0..1000):
; scrolling through a list does not rebuild the skater at every step.
cas_preview_delay_ms = 150

; Create-a-Skater Plus:
;   - every clothing piece, hat, glasses, shoes, socks and accessory can take a color, with
;     full color, vibrance and lightness ranges, a SWATCH row, and Square / Circle to copy /
;     paste a color between pieces;
;   - SKIN TONE on the FACE page (one color for face, neck, arms, hands and legs; eyes and
;     teeth keep theirs);
;   - BODY SHAPE and FACE SHAPE pages (size, length and thickness of body parts; head, chin,
;     jaw, nose, eyes, eyelids, brows, cheeks, lips and mouth).
; Everything is saved with your skater. off = the stock Create-a-Skater.
cas_plus = on

; all   = every piece in every list: locked and secret pieces, pieces of the other styles
;         (e.g. combat boots for every style). The game's own rules still stop pieces that
;         cannot go together.
; stock = only what the game shows (locked pieces stay hidden until unlocked).
cas_items = all

; on  = every clothing piece can take a color (pieces the game does not color, e.g. most shoes
;       and accessories, get the color rows).
; off = only the pieces the game already lets you color. Needs cas_plus = on.
cas_color_all = on

; Folder for the files the plugin writes: SAVE LOOK's looks, the eye color textures, and settings
; changed in the game (CONTROL SETUP's camera invert) in thp8_mod_p8plus.user.ini, whose keys then win
; over this file. Unset = the mods folder (<mods>\_cas_presets, <mods>\_cas_plus) and this file, as
; always. When set, LOAD LOOK lists the looks in both places. The browser version sets it to its own
; saved-data storage.
; user_data_dir =

[startup]
; The boot movies (publisher / developer logos, PRESS START, intro) play as in the
; stock game, and any button or key (or a click) skips the one that is playing: one
; press per movie; the PRESS START screen still waits for Start. The intro can only be
; skipped once the game has built its data cache (the very first start builds it behind
; the intro), as in the stock game.
; straight_to_menu = on: straight to the main menu instead -- no logos, no PRESS START
; screen, no intro, the boot splash only for a second (on the very first start the
; intro still plays until the cache is done). This was skip_intro = on, which is no
; longer read.
straight_to_menu = off

; on  = when a start builds the game's data cache (the very first start, or the first start
;       after the mods changed) a "Preparing the game for first launch" screen with a progress
;       bar is shown instead of the intro until the cache is done (under a minute). Later
;       starts never show it.
; off = the intro plays while the cache is built (the stock first start)
first_launch_screen = on

[debug]
; on = log the first hit of every hook (what it changed) at INFO level, the
; hit counts every ~30 s while they change, and at exit. Useful to verify the
; plugin on a new build.
; (Without it those lines go to the DEBUG level, shown with PS3MOD_DEBUG=1.)
verbose = off

; Diagnostics only (implies verbose): count EVERY call of each hooked function
; (matching call site or not) and time the hook chain of one cheap function, to
; measure the plugin's overhead. Adds a little overhead itself. Leave off.
count_calls = off
